- role: initiator
  operations:
  - generate_nonces:
    - ~na
  - send:
    - ~na
    - '''Init'''
- role: responder
  operations:
  - receive:
    - na
    - '''Init'''
  - generate_nonces:
    - ~nb
  - send:
    - h(na XOR ~k XOR ~nb)
    - ~nb
- role: initiator2
  operations:
  - receive:
    - m
    - nb
  - assert:
    - h(~na XOR ~k XOR nb) = m
  - send: <END>
