- role: initiator
  operations:
  - generate_nonces:
    - ~na
  - send:
    - ~na
- role: responder
  operations:
  - receive:
    - na
  - generate_nonces:
    - ~nb
  - send:
    - h(na XOR ~k XOR ~nb)
    - ~nb
    - '''Resp'''
- role: initiator2
  operations:
  - receive:
    - m
    - nb
    - '''Resp'''
  - assert:
    - h(~na XOR ~k XOR nb) = m
  - send: <END>
