- role: initiator
  operations:
  - generate_nonces:
    - ~na
  - send:
    - ~na
- role: responder
  operations:
  - receive:
    - na
  - generate_nonces:
    - ~nb
  - send:
    - h(<na XOR ~k XOR ~nb, 'Init'>)
    - ~nb
- role: initiator2
  operations:
  - receive:
    - m
    - nb
  - assert:
    - h(<~na XOR ~k XOR nb, 'Init'>) = m
  - send: <END>
