- role: Reader
  operations:
    - generate_nonces:
        - ~r0
    - send:
        - ~r0
- role: Tag
  operations:
    - receive:
        - r0
    - generate_nonces:
        - ~r1
        - ~r1_aux
    - send:
        - ~r1
        - h(r0 XOR ~r1 XOR ~k)
        - ~r1_aux
- role: Reader
  operations:
    - receive:
        - r1
        - h(~r0 XOR r1 XOR ~k)
        - r1_aux
    - send:
        - h(h(~r0 XOR r1 XOR ~k) XOR ~k XOR ~r0)
- role: Tag
  operations:
    - receive:
        - h(h(r0 XOR ~r1 XOR ~k) XOR ~k XOR r0)
    - send: "<END>"
