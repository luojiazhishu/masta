- role: Initiator
  operations:
  - generate_nonces:
    - ~sec
    - ~pub
  - compute:
    - msg = senc(<~sec, ~pub>, k)
  - send:
    - msg
- role: Responder
  operations:
  - receive:
    - msg
  - compute:
    - body = sdec(<msg>, key)
    - sec = fst(sdec(<msg>, key))
    - pub = snd(sdec(<msg>, key))
    - auxr = tag_aux(fst(sdec(<msg>, key)), snd(sdec(<msg>, key)))
  - send: <END>
