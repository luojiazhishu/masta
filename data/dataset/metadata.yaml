dataset:
  name: formal-agent-dataset
  version: 0.2.0
  description: 'Tamarin-protocol dataset for benchmarking natural-language to formal-model
    extraction agents.  Each entry carries an RFC-style specification, a reference
    Tamarin model, an action-block encoding, indexed lemma definitions with expected
    verification outcomes, and renaming / weakness variants.

    '
  entry_layout: "<NNN_slug>/\n  document.txt\n  model.spthy\n  action_blocks.yaml\n\
    \  lemmas/<NN>_<TYPE>_<LEMMANAME>/\n    definition.txt\n    outcome.txt\n  action_variants/<NN>/\n\
    \    document.txt\n    action_blocks.yaml\n  weakness_variants/<NN>/\n    document.txt\n\
    \    <LEMMANAME>/outcome.txt\n    \n"
entries:
- id: 001_cr_xor
  title: A Challenge-Response Authentication Protocol Using XOR-Combined Hash Verification
  source: mock
  builtins:
  - xor
  - hashing
  roles:
  - Initiator
  - Responder
  lemmas:
  - name: aliveness
    type: aliveness
    outcome: verified
  - name: noninjective_agreement
    type: noninjective_agreement
    outcome: falsified
  action_variants:
  - id: '01'
    description: A Challenge-Response Authentication Protocol with an Echoed Client
      Nonce
  - id: '02'
    description: A Challenge-Response Authentication Protocol with an Initiator Marker
  - id: '03'
    description: A Challenge-Response Authentication Protocol with a Responder Marker
  - id: '04'
    description: A Challenge-Response Authentication Protocol with an Initiator Audit
      Tag
  - id: '05'
    description: A Challenge-Response Authentication Protocol with a Responder Audit
      Tag
  - id: '06'
    description: A Challenge-Response Authentication Protocol with a Domain Separator
  - id: '07'
    description: A Challenge-Response Authentication Protocol with Responder Reply
      Retransmission
  - id: 08
    description: A Challenge-Response Authentication Protocol with Initiator Challenge
      Retransmission
  weakness_variants:
  - id: '01'
    description: A Challenge-Response Authentication Protocol Without Tag Verification
    falsified_lemmas:
    - aliveness
  - id: '02'
    description: A Challenge-Response Authentication Protocol With Keyless Initiator-Side
      Verification
    falsified_lemmas:
    - aliveness
  - id: '03'
    description: A Challenge-Response Authentication Protocol With Bootstrap-Time
      Key Disclosure
    falsified_lemmas:
    - aliveness
