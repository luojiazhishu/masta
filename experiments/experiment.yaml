dataset_dir: data/dataset
runs_dir: runs
runs_per_protocol: 1
parallel: 8
tamarin_timeout_seconds: 300
task_timeout_seconds: 3600
experiments:
- masta
- opencode
- codex
- claude
systems:
  masta:
    models:
    - qwen3.5-plus
  codex:
    models:
    - gpt-5.5
  claude:
    models:
    - opus-4.7
  opencode:
    models:
    - qwen3.5-plus
llm_temperature: 0.0
llm_seed: 42
llm_max_tokens: null
llm_reasoning: true
llm_reasoning_budget: null
providers:
  qwen3.5-plus:
    model: qwen3.5-plus
    provider: openai
    base_url: https://example.invalid/v1
    api_key: <REDACTED>
  gpt-5.5:
    model: gpt-5.5
    provider: openai
    base_url: https://example.invalid/v1
    api_key: <REDACTED>
  opus-4.7:
    model: claude-opus-4-7
    provider: anthropic
    base_url: https://example.invalid/v1/messages
    api_key: <REDACTED>
