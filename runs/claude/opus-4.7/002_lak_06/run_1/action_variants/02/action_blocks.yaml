- role: Reader_Start
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: Tag_Respond
  operations:
  - receive:
    - r0
  - generate_nonces:
    - ~r1
    - ~r1aux
  - compute:
    - tag_mac = h(r0 XOR ~r1 XOR ~k)
  - send:
    - ~r1
    - tag_mac
    - ~r1aux
- role: Reader_Finish
  operations:
  - receive:
    - r1
    - tag_mac
    - r1aux
  - compute:
    - expected = h(~r0 XOR r1 XOR ~k)
    - reader_mac = h(h(~r0 XOR r1 XOR ~k) XOR ~k XOR ~r0)
  - assert:
    - tag_mac = expected
  - send:
    - reader_mac
- role: Tag_Finish
  operations:
  - receive:
    - reader_mac
  - compute:
    - expected = h(tag_mac XOR ~k XOR r0)
  - assert:
    - reader_mac = expected
  - send: <END>
