- role: Reader_Init
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: Tag_Respond
  operations:
  - receive:
    - r0
  - generate_nonces:
    - ~r1
  - compute:
    - tag_mac = h((r0 XOR ~r1) XOR k)
  - send:
    - ~r1
    - tag_mac
- role: Reader_Confirm
  operations:
  - receive:
    - r1
    - tag_mac
  - compute:
    - expected_tag_mac = h((~r0 XOR r1) XOR k)
    - reader_mac = h((h((~r0 XOR r1) XOR k) XOR k) XOR ~r0)
  - assert:
    - tag_mac = expected_tag_mac
  - send:
    - '''CONF'''
    - reader_mac
- role: Tag_Finish
  operations:
  - receive:
    - '''CONF'''
    - reader_mac
  - compute:
    - expected_reader_mac = h((tag_mac XOR k) XOR r0)
  - assert:
    - reader_mac = expected_reader_mac
  - send: <END>
