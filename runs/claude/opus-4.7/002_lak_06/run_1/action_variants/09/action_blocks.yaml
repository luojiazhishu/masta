- role: Reader_Start
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: Tag_Respond
  operations:
  - receive:
    - r0
  - generate_nonces:
    - ~r1
  - send:
    - ~r1
    - h(<r0, ~r1, ~k, 'TAG_TAG'>)
- role: Reader_Verify
  operations:
  - receive:
    - r1
    - tag_mac
  - assert:
    - tag_mac = h(<~r0, r1, ~k, 'TAG_TAG'>)
  - send:
    - h(<tag_mac, ~k, ~r0>)
- role: Tag_Finish
  operations:
  - receive:
    - reader_mac
  - assert:
    - reader_mac = h(<h(<r0, ~r1, ~k, 'TAG_TAG'>), ~k, r0>)
  - send: <END>
