- role: R_1_Send_R0
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: T_2_Send_T1
  operations:
  - receive:
    - r0
  - generate_nonces:
    - ~r1
  - compute:
    - tag_mac = h(r0 XOR ~r1 XOR k)
  - send:
    - ~r1
    - ~r1
    - tag_mac
- role: R_3_Send_R1
  operations:
  - receive:
    - r1a
    - r1b
    - mac
  - compute:
    - mac_expected = h(~r0 XOR r1a XOR k)
    - reader_mac = h(h(~r0 XOR r1a XOR k) XOR k XOR ~r0)
  - assert:
    - r1a = r1b
    - mac = mac_expected
  - send:
    - reader_mac
- role: T_4_Recv_R1
  operations:
  - receive:
    - rmac
  - compute:
    - mac_expected = h(tag_mac XOR k XOR r0)
  - assert:
    - rmac = mac_expected
  - send: <END>
