- role: Client_Init
  operations:
  - generate_nonces:
    - ~k
  - send:
    - aenc(~k, pkS)
- role: Server_Recv
  operations:
  - receive:
    - c1
  - compute:
    - k = adec(c1, ~ltk)
  - send:
    - h(k)
    - '''ack'''
- role: Client_Finish
  operations:
  - receive:
    - h(~k)
    - '''ack'''
  - send: <END>
