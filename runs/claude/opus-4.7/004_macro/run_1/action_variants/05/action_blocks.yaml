- role: Client_Init
  operations:
  - generate_nonces:
    - ~k
  - send:
    - aenc(~k, pkS)
- role: Server_Process
  operations:
  - receive:
    - aenc(k, pk(~skS))
  - send:
    - h(k)
    - '''done'''
- role: Client_Finish
  operations:
  - receive:
    - h(~k)
    - '''done'''
  - send: <END>
