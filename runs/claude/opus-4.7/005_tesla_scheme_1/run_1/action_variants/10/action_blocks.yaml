- role: R_SetupRequest
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - $R
    - $S
    - ~n_R
- role: S_SetupResponse
  operations:
  - receive:
    - $R
    - $S
    - n_R
  - generate_nonces:
    - ~k_1
    - ~k_2
  - send:
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), n_R>, ~sk_S)
- role: R_VerifySetup
  operations:
  - receive:
    - $S
    - $R
    - f_k1
    - sig
  - assert:
    - verify(sig, <f_k1, ~n_R>, pk_S) = true
  - send: []
- role: S_SendMsg1
  operations:
  - generate_nonces:
    - ~m_1
  - send:
    - <~m_1, f(~k_2)>
    - mac(~k_1, <~m_1, f(~k_2)>)
- role: R_BufferMsg1
  operations:
  - receive:
    - d1
    - mac1
  - send: []
- role: S_SendMsg2
  operations:
  - generate_nonces:
    - ~m_2
    - ~k_3
  - send:
    - <~m_2, f(~k_3), ~k_1>
    - mac(~k_2, <~m_2, f(~k_3), ~k_1>)
- role: R_VerifyMsg1
  operations:
  - receive:
    - <m_2, f_k3, k_1>
    - mac2
  - assert:
    - f(k_1) = f_k1
    - mac(k_1, d1) = mac1
  - send: <END>
