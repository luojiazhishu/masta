- role: Sender_Init
  operations:
  - generate_nonces:
    - ~k1
  - send: []
- role: Receiver_Setup_Request
  operations:
  - generate_nonces:
    - ~nR
  - send:
    - $R
    - $S
    - ~nR
- role: Sender_Setup_Response
  operations:
  - receive:
    - r
    - $S
    - nR
  - send:
    - $S
    - r
    - h(~k1)
    - sign(<h(~k1), nR>, ~sk)
- role: Receiver_Process_Setup
  operations:
  - receive:
    - $S
    - $R
    - commit
    - sig
  - assert:
    - verify(sig, <commit, ~nR>, pkS) = true
  - send: []
- role: Sender_Broadcast_Msg1
  operations:
  - generate_nonces:
    - ~k2
    - ~m1
  - send:
    - ~m1
    - h(~k2)
    - mac(~k1, <~m1, h(~k2)>)
- role: Receiver_Cache_Msg1
  operations:
  - receive:
    - m1
    - fk2
    - mac1
  - send: []
- role: Sender_Broadcast_Msg2
  operations:
  - generate_nonces:
    - ~k3
    - ~m2
  - send:
    - ~m2
    - h(~k3)
    - ~k1
    - mac(~k2, <~m2, h(~k3), ~k1>)
- role: Receiver_Verify_Msg1
  operations:
  - receive:
    - m2
    - fk3
    - k1_disc
    - mac2
  - assert:
    - h(k1_disc) = commit_k1
    - mac(k1_disc, <m1, fk2>) = mac1
  - send: <END>
