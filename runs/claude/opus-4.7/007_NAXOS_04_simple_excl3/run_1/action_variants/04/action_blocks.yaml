- role: Init_1
  operations:
  - generate_nonces:
    - ~eskI
  - compute:
    - exI = h1(<~eskI, ~lkI>)
    - hkI = 'g'^h1(<~eskI, ~lkI>)
    - aux = com($I, $R)
  - send:
    - hkI
- role: Resp_1
  operations:
  - receive:
    - X
  - generate_nonces:
    - ~eskR
  - compute:
    - exR = h1(<~eskR, ~lkR>)
    - hkR = 'g'^h1(<~eskR, ~lkR>)
    - kR = h2(<pkI^h1(<~eskR, ~lkR>), X^~lkR, $I, $R>)
  - send:
    - hkR
- role: Init_2
  operations:
  - receive:
    - Y
  - compute:
    - exI = h1(<~eskI, ~lkI>)
    - kI = h2(<Y^~lkI, pkR^h1(<~eskI, ~lkI>), $I, $R>)
  - send: <END>
