- role: Initiator_Send
  operations:
  - send:
    - sign(<$I, $R>, ~ltkI)
- role: Responder_Send
  operations:
  - receive:
    - mI
  - assert:
    - verify(mI, <$I, $R>, pkI) = true
  - send:
    - sign(<$I, $R>, ~ltkR)
    - com($R, $I)
- role: Initiator_Finish
  operations:
  - receive:
    - mR
  - assert:
    - verify(mR, <$I, $R>, pkR) = true
  - send: <END>
