- role: DeviceSendJoinRequest
  operations:
  - generate_nonces:
    - ~devnonce
  - compute:
    - m = mac(~appkey, <'JoinRequest', ~deveui, ~joineui, ~devnonce>)
  - send:
    - '''JoinRequest'''
    - ~deveui
    - ~joineui
    - ~devnonce
    - m
- role: NetworkRecvJoinRequest
  operations:
  - receive:
    - '''JoinRequest'''
    - ~deveui
    - ~joineui
    - devnonce
    - m
  - generate_nonces:
    - ~joinnonce
    - ~devaddr
  - compute:
    - appskey = senc(<'cst1', devnonce, ~joinnonce>, ~appkey)
    - nwkskey = senc(<'cst2', devnonce, ~joinnonce>, ~appkey)
    - responsemac = mac(~appkey, <'JoinAccept', ~joinnonce, ~devaddr>)
    - body = <'JoinAccept', ~joinnonce, ~devaddr, mac(~appkey, <'JoinAccept', ~joinnonce,
      ~devaddr>)>
    - ct = senc(<'JoinAccept', ~joinnonce, ~devaddr, mac(~appkey, <'JoinAccept', ~joinnonce,
      ~devaddr>)>, ~appkey)
  - assert:
    - m = mac(~appkey, <'JoinRequest', ~deveui, ~joineui, devnonce>)
  - send:
    - ct
    - ct
- role: DeviceRecvJoinAccept
  operations:
  - receive:
    - senc(<'JoinAccept', joinnonce, devaddr, mm>, ~appkey)
  - assert:
    - mm = mac(~appkey, <'JoinAccept', joinnonce, devaddr>)
  - send: []
- role: DeviceDeriveKeys
  operations:
  - compute:
    - appskey = senc(<'cst1', ~devnonce, joinnonce>, ~appkey)
    - nwkskey = senc(<'cst2', ~devnonce, joinnonce>, ~appkey)
  - send: <END>
