- role: B_Challenge
  operations:
  - generate_nonces:
    - ~RB
    - ~Text1
  - send:
    - ~RB
    - ~Text1
- role: A_TokenAB
  operations:
  - receive:
    - RB
    - Text1
    - ra
  - generate_nonces:
    - ~Text2
    - ~Text3
  - send:
    - ra
    - ~Text3
    - <'sid1_mut_cr', ra, RB, $B, ~Text2>
    - mac(<'sid1_mut_cr', ra, RB, $B>, ~kAB)
- role: B_TokenBA
  operations:
  - receive:
    - RA
    - Text3
    - <'sid1_mut_cr', RA, ~RB, $B, Text2>
    - mac_val
  - generate_nonces:
    - ~Text5
    - ~NonceB2
  - assert:
    - mac_val = mac(<'sid1_mut_cr', RA, ~RB, $B>, ~kAB)
  - send:
    - ~Text5
    - mac(<'sid2_mut_cr', ~RB, RA>, ~kAB)
    - ~NonceB2
- role: A_Verify
  operations:
  - receive:
    - Text5
    - mac_val2
    - NonceB2
  - assert:
    - mac_val2 = mac(<'sid2_mut_cr', RB, ra>, ~kAB)
  - send: <END>
