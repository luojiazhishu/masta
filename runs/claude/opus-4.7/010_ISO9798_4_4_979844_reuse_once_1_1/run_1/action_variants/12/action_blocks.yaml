- role: B_Start
  operations:
  - generate_nonces:
    - ~RB
    - ~Text1
  - send:
    - ~RB
    - ~Text1
- role: A_Recv_Challenge_Send1
  operations:
  - receive:
    - RB
    - Text1
  - generate_nonces:
    - ~Text2
    - ~Text3
  - compute:
    - mac1 = mac(<'sid1_mut_cr', ~RA, RB, $B>, ~kAB)
  - send:
    - ~RA
    - ~Text3
    - <'sid1_mut_cr', ~RA, RB, $B, ~Text2>
    - mac1
- role: A_Send2
  operations:
  - compute:
    - mac1 = mac(<'sid1_mut_cr', ~RA, RB, $B>, ~kAB)
  - send:
    - ~RA
    - ~Text3
    - <'sid1_mut_cr', ~RA, RB, $B, ~Text2>
    - mac1
- role: B_Recv_TokenAB_Send_TokenBA
  operations:
  - receive:
    - RA
    - Text3
    - <'sid1_mut_cr', RA, ~RB, $B, Text2>
    - mac1
  - generate_nonces:
    - ~Text4
    - ~Text5
  - compute:
    - mac1 = mac(<'sid1_mut_cr', RA, ~RB, $B>, ~kAB)
    - mac2 = mac(<'sid2_mut_cr', ~RB, RA>, ~kAB)
  - send:
    - ~Text5
    - mac2
- role: A_Recv_TokenBA
  operations:
  - receive:
    - Text5
    - mac2
  - compute:
    - mac2 = mac(<'sid2_mut_cr', RB, ~RA>, ~kAB)
  - send: <END>
