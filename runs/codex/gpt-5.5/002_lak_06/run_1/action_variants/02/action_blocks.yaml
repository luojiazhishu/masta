- role: Reader_Send_R0
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: Tag_Send_T1
  operations:
  - generate_nonces:
    - ~r1
    - ~r1_aux
  - compute:
    - tag_mac = h(<'xor_r0_r1_k', r0, ~r1, k>)
  - send:
    - ~r1
    - tag_mac
    - ~r1_aux
- role: Reader_Send_R1
  operations:
  - compute:
    - reader_mac = h(<'xor_tagmac_k_r0', tag_mac, k, r0>)
  - send:
    - reader_mac
- role: Tag_Accept_R1
  operations:
  - compute:
    - expected = h(<'xor_tagmac_k_r0', tag_mac, k, r0>)
  - send: <END>
