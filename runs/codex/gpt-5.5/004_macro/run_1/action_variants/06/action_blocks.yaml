- role: Client_Initiate
  operations:
  - generate_nonces:
    - ~k
  - send:
    - $C
    - aenc(~k, pkS)
- role: Server_Confirm
  operations:
  - receive:
    - $C
    - ct
  - send:
    - h(<adec(ct, ltk), 'session'>)
- role: Client_Accept
  operations:
  - receive:
    - h(<k, 'session'>)
  - send: <END>
