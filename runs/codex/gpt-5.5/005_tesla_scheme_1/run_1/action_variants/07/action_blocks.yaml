- role: Receiver_Setup_Request
  operations:
  - generate_nonces:
    - ~nR
  - send:
    - $R
    - $S
    - ~nR
- role: Sender_Setup_Response
  operations:
  - receive:
    - R
    - $S
    - nR
  - generate_nonces:
    - ~k1
  - compute:
    - c1 = h(~k1)
    - sig = sign(<h(~k1), nR>, skS)
  - send:
    - $S
    - R
    - c1
    - sig
- role: Receiver_Verify_Setup
  operations:
  - receive:
    - $S
    - $R
    - c1
    - sig
  - assert:
    - verify(sig, <c1, nR>, pkS) = true
  - send: []
- role: Sender_First_Stream
  operations:
  - generate_nonces:
    - ~k2
    - ~m1
  - compute:
    - c2 = h(~k2)
    - d1 = <~m1, h(~k2)>
  - send:
    - d1
    - mac(k1, d1)
    - '''data1_marker'''
- role: Receiver_Cache_First_Stream
  operations:
  - receive:
    - <m1, c2>
    - mac1
    - '''data1_marker'''
  - send: []
- role: Sender_Subsequent_Stream_Disclose
  operations:
  - generate_nonces:
    - ~k3
    - ~m2
  - compute:
    - c3 = h(~k3)
    - d2 = <~m2, h(~k3), k1>
  - send:
    - d2
    - mac(k2, d2)
- role: Receiver_Verify_First_Stream
  operations:
  - receive:
    - <m2, c3, k1>
    - mac2
  - assert:
    - h(k1) = c1
  - send: <END>
