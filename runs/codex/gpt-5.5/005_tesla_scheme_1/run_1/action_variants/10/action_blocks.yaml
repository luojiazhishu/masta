- role: Sender_Broadcast_Data
  operations:
  - generate_nonces:
    - ~k2
    - ~m
  - compute:
    - next_commitment = f(~k2)
    - data = <~m, f(~k2)>
    - tag = mac(k1, <~m, f(~k2)>)
  - send:
    - '''msg1'''
    - S
    - R
    - data
    - tag
- role: Receiver_Setup_Request
  operations:
  - generate_nonces:
    - ~nR
  - send:
    - '''msg0a'''
    - $R
    - $S
    - ~nR
- role: Sender_Setup_Response_And_Log
  operations:
  - receive:
    - '''msg0a'''
    - R
    - S
    - nR
  - generate_nonces:
    - ~k1
  - compute:
    - commitment = f(~k1)
    - signature = sign(<f(~k1), nR>, ltkS)
    - request_record = bar(nR)
  - send:
    - '''msg0b'''
    - S
    - R
    - commitment
    - signature
- role: Receiver_Verifies_Setup_Response
  operations:
  - receive:
    - '''msg0b'''
    - S
    - R
    - commitment
    - signature
  - assert:
    - verify(signature, <commitment, nR>, pkS) = true
  - send: []
- role: Receiver_Stores_Data
  operations:
  - receive:
    - '''msg1'''
    - S
    - R
    - data
    - tag
  - send: []
- role: Sender_Discloses_Key
  operations:
  - send:
    - '''msgn'''
    - S
    - R
    - k1
- role: Receiver_Accepts_Data
  operations:
  - receive:
    - '''msgn'''
    - S
    - R
    - k1
  - send: <END>
