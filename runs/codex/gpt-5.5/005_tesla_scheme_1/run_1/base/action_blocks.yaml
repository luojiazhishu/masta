- role: Sender_Init
  operations:
  - generate_nonces:
    - ~k1
  - send: []
- role: Receiver_Setup_Request
  operations:
  - generate_nonces:
    - ~rid
    - ~nR
  - send:
    - '''setup_request'''
    - $R
    - $S
    - ~nR
- role: Sender_Setup_Response
  operations:
  - receive:
    - '''setup_request'''
    - R
    - S
    - nR
  - send:
    - '''setup_response'''
    - S
    - R
    - c1
    - sign(<c1, nR>, ltk)
- role: Receiver_Setup_Accept
  operations:
  - receive:
    - '''setup_response'''
    - S
    - R
    - c1
    - sign(<c1, nR>, ltk)
  - send: []
- role: Sender_Send_First
  operations:
  - generate_nonces:
    - ~k2
    - ~m1
  - send:
    - '''stream1'''
    - ~m1
    - h(~k2)
    - mac(k1, <~m1, h(~k2)>)
- role: Receiver_Cache_First
  operations:
  - receive:
    - '''stream1'''
    - m1
    - c2
    - tag1
  - send: []
- role: Sender_Send_Second_Disclose
  operations:
  - generate_nonces:
    - ~k3
    - ~m2
  - send:
    - '''stream2'''
    - ~m2
    - h(~k3)
    - k1
    - mac(k2, <~m2, h(~k3), k1>)
- role: Receiver_Verify_First
  operations:
  - receive:
    - '''stream2'''
    - m2
    - c3
    - k1
    - tag2
  - assert:
    - c1 = h(k1)
    - tag1 = mac(k1, <m1, c2>)
  - send: <END>
