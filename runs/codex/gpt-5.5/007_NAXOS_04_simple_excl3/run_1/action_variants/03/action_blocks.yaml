- role: Initiator_1
  operations:
  - generate_nonces:
    - ~eskI
    - ~tidI
  - compute:
    - exI = h1(<~eskI, ~lkI>)
    - hkI = 'g'^h1(<~eskI, ~lkI>)
  - send:
    - hkI
- role: Responder_2
  operations:
  - receive:
    - X
  - generate_nonces:
    - ~eskR
    - ~tidR
  - compute:
    - exR = h1(<~eskR, ~lkR>)
    - hkR = 'g'^h1(<~eskR, ~lkR>)
    - kR = h2(<pkI^h1(<~eskR, ~lkR>), X^~lkR, $I, $R>)
  - send:
    - hkR
    - '''NAXOS-v1'''
- role: Initiator_3
  operations:
  - receive:
    - Y
    - '''NAXOS-v1'''
  - compute:
    - kI = h2(<Y^~lkI, pkR^exI, $I, $R>)
  - send: <END>
