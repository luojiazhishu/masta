- role: Initiator_Audit
  operations:
  - generate_nonces:
    - ~eskI
    - ~tid
  - compute:
    - audit = com($I, $R)
    - exI = h1(<~eskI, ~lkI>)
  - send: []
- role: Initiator_Send_Message1
  operations:
  - compute:
    - hkI = 'g'^exI
  - send:
    - hkI
- role: Responder_Message1_Message2
  operations:
  - receive:
    - X
  - generate_nonces:
    - ~eskR
    - ~tidR
  - compute:
    - exR = h1(<~eskR, ~lkR>)
    - hkR = 'g'^h1(<~eskR, ~lkR>)
    - kR = h2(<pkI^h1(<~eskR, ~lkR>), X^~lkR, $I, $R>)
  - send:
    - hkR
- role: Initiator_Receive_Message2
  operations:
  - receive:
    - Y
  - compute:
    - kI = h2(<Y^~lkI, pkR^exI, $I, $R>)
  - send: <END>
