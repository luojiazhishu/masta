- role: Device_Initiate_Join
  operations:
  - generate_nonces:
    - ~devnonce
    - ~transportid
  - compute:
    - req_body = <'JoinRequest', deveui, joineui, ~devnonce>
    - req_mac = mac(appkey, <'JoinRequest', deveui, joineui, ~devnonce>)
    - req_msg = <'JoinRequest', deveui, joineui, ~devnonce, mac(appkey, <'JoinRequest',
      deveui, joineui, ~devnonce>), ~transportid>
  - send:
    - req_msg
- role: Server_Verify_JoinRequest
  operations:
  - receive:
    - req_msg
  - compute:
    - req_body = <'JoinRequest', deveui, joineui, devnonce>
    - req_mac = mac(appkey, <'JoinRequest', deveui, joineui, devnonce>)
    - req_msg = <'JoinRequest', deveui, joineui, devnonce, mac(appkey, <'JoinRequest',
      deveui, joineui, devnonce>), transportid>
  - send: []
- role: Server_Send_JoinAccept
  operations:
  - generate_nonces:
    - ~joinnonce
  - compute:
    - app_skey = senc(<cst1, devnonce, ~joinnonce>, appkey)
    - nwk_skey = senc(<cst2, devnonce, ~joinnonce>, appkey)
    - response_mac = mac(appkey, <'JoinAccept', ~joinnonce, devaddr>)
    - accept_body = <'JoinAccept', ~joinnonce, devaddr, mac(appkey, <'JoinAccept',
      ~joinnonce, devaddr>)>
    - accept_msg = senc(<'JoinAccept', ~joinnonce, devaddr, mac(appkey, <'JoinAccept',
      ~joinnonce, devaddr>)>, appkey)
  - send:
    - accept_msg
- role: Device_Process_JoinAccept
  operations:
  - receive:
    - accept_msg
  - compute:
    - response_mac = mac(appkey, <'JoinAccept', joinnonce, devaddr>)
    - accept_body = <'JoinAccept', joinnonce, devaddr, mac(appkey, <'JoinAccept',
      joinnonce, devaddr>)>
    - accept_msg = senc(<'JoinAccept', joinnonce, devaddr, mac(appkey, <'JoinAccept',
      joinnonce, devaddr>)>, appkey)
    - app_skey = senc(<cst1, devnonce, joinnonce>, appkey)
    - nwk_skey = senc(<cst2, devnonce, joinnonce>, appkey)
  - send: <END>
