- role: Responder_Challenge
  operations:
  - generate_nonces:
    - ~rb
    - ~text1
  - send:
    - ~rb
    - ~text1
- role: Initiator_TokenAB
  operations:
  - receive:
    - rb
    - text1
  - generate_nonces:
    - ~text2
    - ~text3
  - send:
    - '''ra_dup'''
    - ~text3
    - <'sid1_mut_cr', 'ra_dup', rb, 'IdB', ~text2>
    - mac(<'sid1_mut_cr', 'ra_dup', rb, 'IdB'>, k)
- role: Responder_TokenBA
  operations:
  - receive:
    - ra
    - text3
    - <'sid1_mut_cr', ra, rb, 'IdB', text2>
    - mac(<'sid1_mut_cr', ra, rb, 'IdB'>, k)
  - generate_nonces:
    - ~text4
    - ~text5
  - send:
    - ~text5
    - mac(<'sid2_mut_cr', rb, ra>, k)
    - '''token_ba'''
- role: Initiator_Finish
  operations:
  - receive:
    - text5
    - mac(<'sid2_mut_cr', rb, ra>, k)
    - '''token_ba'''
  - send: <END>
