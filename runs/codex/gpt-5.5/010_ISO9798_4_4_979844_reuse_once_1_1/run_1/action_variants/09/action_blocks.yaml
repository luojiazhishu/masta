- role: Responder_Send_Challenge
  operations:
  - generate_nonces:
    - ~RB
    - ~Text1
  - send:
    - ~RB
    - ~Text1
- role: Initiator_Send_Token
  operations:
  - receive:
    - RB
    - Text1
  - generate_nonces:
    - ~Text2
    - ~Text3
  - compute:
    - mac1 = mac(<'sid1_mut_cr', RA, RB, 'B', 'mac1_tag'>, kAB)
    - tagged1 = <'sid1_mut_cr', RA, RB, 'B', ~Text2>
  - send:
    - RA
    - ~Text3
    - tagged1
    - mac1
- role: Responder_Verify_And_Send_Token
  operations:
  - receive:
    - RA
    - Text3
    - tagged1
    - mac1
  - generate_nonces:
    - ~Text4
    - ~Text5
  - compute:
    - mac1 = mac(<'sid1_mut_cr', RA, RB, 'B', 'mac1_tag'>, kAB)
    - mac2 = mac(<'sid2_mut_cr', RB, RA>, kAB)
  - send:
    - ~Text5
    - mac2
- role: Initiator_Verify_Token
  operations:
  - receive:
    - Text5
    - mac2
  - compute:
    - mac2 = mac(<'sid2_mut_cr', RB, RA>, kAB)
  - send: <END>
