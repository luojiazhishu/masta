- role: Responder_Challenge
  operations:
  - generate_nonces:
    - ~rb
    - ~text1
  - send:
    - ~rb
    - ~text1
- role: Initiator_Token
  operations:
  - receive:
    - rb
    - text1
  - generate_nonces:
    - ~text2
    - ~text3
  - send:
    - ra
    - ~text3
    - <'sid1_mut_cr', ra, rb, 'B', ~text2>
    - mac(<'sid1_mut_cr', ra, rb, 'B'>, k)
- role: Responder_Token
  operations:
  - receive:
    - ra
    - text3
    - tagged1
    - mac(<'sid1_mut_cr', ra, rb, 'B'>, k)
  - generate_nonces:
    - ~text4
    - ~text5
  - send:
    - ~text5
    - mac(<'sid2_mut_cr', rb, ra, 'mac2_tag'>, k)
- role: Initiator_Verify
  operations:
  - receive:
    - text5
    - mac(<'sid2_mut_cr', rb, ra, 'mac2_tag'>, k)
  - send: <END>
