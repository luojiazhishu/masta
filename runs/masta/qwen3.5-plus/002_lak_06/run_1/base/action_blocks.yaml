- role: RuleStep1
  operations:
  - generate_nonces:
    - ~r0
    - ~k
  - send:
    - ~r0
- role: RuleStep2
  operations:
  - receive:
    - r0
  - generate_nonces:
    - ~r1
  - compute:
    - tag_mac = h(r0 XOR ~r1 XOR k)
  - send:
    - ~r1
    - tag_mac
- role: RuleStep3
  operations:
  - receive:
    - r1
    - h(r0 XOR r1 XOR k)
  - send:
    - h(h(r0 XOR r1 XOR k) XOR k XOR r0)
- role: RuleStep4
  operations:
  - receive:
    - expected
  - compute:
    - expected = h(tag_mac XOR k XOR r0)
  - send: <END>
