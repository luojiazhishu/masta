- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
    - ~rc
  - compute:
    - ciphertext = aenc(~k, pkS)
  - send:
    - ciphertext
    - ~rc
- role: RuleStep2
  operations:
  - receive:
    - ciphertext
    - rc
  - compute:
    - k = adec(ciphertext, skS)
    - digest = h(adec(ciphertext, skS))
  - send:
    - digest
    - rc
- role: RuleStep3
  operations:
  - receive:
    - expected_digest
    - rc
  - compute:
    - expected_digest = h(k)
  - send: <END>
