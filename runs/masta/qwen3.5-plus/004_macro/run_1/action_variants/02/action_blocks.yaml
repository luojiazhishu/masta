- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
    - ~tid
  - compute:
    - m1 = aenc(~k, pkS)
  - send:
    - m1
- role: RuleStep2
  operations:
  - receive:
    - m1
  - generate_nonces:
    - ~rs
  - compute:
    - k = adec(m1, sk)
    - m2 = <h(adec(m1, sk)), ~rs>
  - send:
    - m2
- role: RuleStep3
  operations:
  - receive:
    - m2
  - compute:
    - m2 = <h(~k), ~rs>
  - send: <END>
