- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
    - ~tid
  - send:
    - aenc(~k, pkS)
    - '''init'''
- role: RuleStep2
  operations:
  - receive:
    - m1
  - compute:
    - k = adec(fst(m1), ~sk)
    - m2 = h(adec(fst(m1), ~sk))
  - send:
    - m2
- role: RuleStep3
  operations:
  - receive:
    - m2
  - send: <END>
