- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
    - ~C
  - compute:
    - m1 = aenc(<~C, ~k>, pkS)
  - send:
    - m1
- role: RuleStep2
  operations:
  - receive:
    - m1
  - compute:
    - payload = adec(m1, ltk)
    - C = fst(adec(m1, ltk))
    - k = snd(adec(m1, ltk))
    - m2 = h(<snd(adec(m1, ltk)), $S>)
  - send:
    - m2
- role: RuleStep3
  operations:
  - receive:
    - m2
  - compute:
    - expected = h(<k, $S>)
  - send: <END>
