- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
    - ~tag_R
  - send:
    - $R
    - $S
    - ~n_R
    - ~tag_R
- role: RuleStep2
  operations:
  - receive:
    - $R
    - $S
    - ~n_R
    - ~tag_R
  - generate_nonces:
    - ~k_1
  - send:
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), ~n_R, ~tag_R>, ~sk_S)
- role: RuleStep3
  operations:
  - generate_nonces:
    - ~k_next
    - ~m_1
  - send:
    - <~m_1, f(~k_next)>
    - MAC(~k_cur, <~m_1, f(~k_next)>)
- role: RuleStep4
  operations:
  - generate_nonces:
    - ~k_next
    - ~m_n
  - send: <END>
