- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - $R
    - $S
    - ~n_R
- role: RuleStep2
  operations:
  - receive:
    - $R
    - $S
    - ~n_R
  - generate_nonces:
    - ~k_1
  - send:
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), ~n_R>, $SK_S)
- role: RuleStep3
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - send:
    - <~m_1, f(~k_2)>
    - mac(~k_1, <~m_1, f(~k_2)>)
    - '''data1_marker'''
- role: RuleStep4
  operations:
  - receive:
    - D_1
    - mac_1
    - '''data1_marker'''
  - generate_nonces:
    - ~tid_R
  - send: []
- role: RuleStep5
  operations:
  - generate_nonces:
    - ~k_next
    - ~m_n
  - send:
    - <~m_n, f(~k_next), ~k_curr>
    - mac(~k_curr, <~m_n, f(~k_next), ~k_curr>)
- role: RuleStep6
  operations:
  - receive:
    - D_n
    - mac_n
  - generate_nonces:
    - ~tid_R2
  - send: <END>
