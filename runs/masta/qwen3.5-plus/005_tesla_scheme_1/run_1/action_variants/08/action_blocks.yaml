- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - $R
    - $S
    - ~n_R
- role: RuleStep2
  operations:
  - receive:
    - $R
    - $S
    - n_R
  - generate_nonces:
    - ~k_1
    - ~SK_S
  - send:
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), n_R>, ~SK_S)
- role: RuleStep3
  operations:
  - generate_nonces:
    - ~m_1
    - ~k_2
  - send:
    - <~m_1, f(~k_2)>
    - MAC(k_1, <~m_1, f(~k_2)>)
- role: RuleStep4
  operations:
  - receive:
    - <m_1, f_k2>
    - mac_1
  - send: []
- role: RuleStep5
  operations:
  - generate_nonces:
    - ~m_2
    - ~k_3
  - send:
    - <<~m_2, f(~k_3)>, k_1>
    - MAC(k_2, <<~m_2, f(~k_3)>, k_1>)
    - '''channel_tag'''
- role: RuleStep6
  operations:
  - receive:
    - <<m_2, f_k3>, k_1>
    - mac_2
    - channel_tag
  - send: <END>
