- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - $R
    - $S
    - ~n_R
- role: RuleStep2
  operations:
  - receive:
    - $R
    - $S
    - n_R
  - generate_nonces:
    - ~k_1
  - send:
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), n_R>, ~ltk_S)
- role: RuleStep3
  operations:
  - receive:
    - $S
    - $R
    - f_k1
    - sig
  - send: []
- role: RuleStep4
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - compute:
    - f_k2 = f(~k_2)
    - D_1 = <~m_1, f(~k_2)>
    - mac_1 = mac(k_1, <<~m_1, f(~k_2)>, 'stream'>)
  - send:
    - D_1
    - mac_1
- role: RuleStep5
  operations:
  - receive:
    - D_1
    - mac_1
  - compute:
    - m_1 = fst(D_1)
    - f_k2 = snd(D_1)
  - send: []
- role: RuleStep6
  operations:
  - generate_nonces:
    - ~k_3
    - ~m_2
  - compute:
    - f_k3 = f(~k_3)
    - D_2 = <~m_2, f(~k_3), k_1>
    - mac_2 = mac(k_2, <<~m_2, f(~k_3), k_1>, 'stream'>)
  - send:
    - D_2
    - mac_2
- role: RuleStep7
  operations:
  - receive:
    - D_2
    - mac_2
  - compute:
    - m_2 = fst(D_2)
    - f_k3 = fst(snd(D_2))
    - disclosed_k = snd(snd(D_2))
  - send: []
- role: RuleStep8
  operations:
  - send: <END>
