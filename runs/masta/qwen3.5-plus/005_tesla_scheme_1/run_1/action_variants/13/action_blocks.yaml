- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - '''R'''
    - '''S'''
    - ~n_R
    - '''R'''
    - '''S'''
    - ~n_R
- role: RuleStep2
  operations:
  - receive:
    - '''R'''
    - '''S'''
    - n_R
    - '''R'''
    - '''S'''
    - n_R
  - generate_nonces:
    - ~k_1
  - send:
    - '''S'''
    - '''R'''
    - h(~k_1)
    - sign(<h(~k_1), n_R>, ~sk_S)
- role: RuleStep3
  operations:
  - receive:
    - '''S'''
    - '''R'''
    - commitment
    - signature
  - generate_nonces:
    - ~tid_R
  - send: []
- role: RuleStep4
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - send:
    - h(<~m_1, h(~k_2)>)
    - h(<k_1, ~m_1, h(~k_2)>)
- role: RuleStep5
  operations:
  - receive:
    - data_part
    - mac_part
  - generate_nonces:
    - ~tid_R2
  - send: <END>
