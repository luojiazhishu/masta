- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - $R
    - $S
    - ~n_R
- role: RuleStep2
  operations:
  - receive:
    - $R
    - $S
    - n_R
  - generate_nonces:
    - ~k_1
  - send:
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), n_R>, ~sk_S)
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), n_R>, ~sk_S)
- role: RuleStep3
  operations:
  - receive:
    - S_id
    - R_id
    - commitment
    - signature
    - S_id
    - R_id
    - commitment
    - signature
  - generate_nonces:
    - ~tid_R
  - send: []
- role: RuleStep4
  operations:
  - generate_nonces:
    - ~k_2
  - compute:
    - D_1 = <'m_1', f(~k_2)>
    - mac_1 = h(<~k_1, <'m_1', f(~k_2)>>)
  - send:
    - D_1
    - mac_1
- role: RuleStep5
  operations:
  - receive:
    - D_1
    - mac_1
  - send: <END>
