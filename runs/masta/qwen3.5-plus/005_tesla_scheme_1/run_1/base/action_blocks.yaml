- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - '''R'''
    - '''S'''
    - ~n_R
- role: RuleStep2
  operations:
  - receive:
    - '''R'''
    - '''S'''
    - n_R
  - generate_nonces:
    - ~k_1
    - ~sk_s
  - send:
    - '''S'''
    - '''R'''
    - f(~k_1)
    - sign(<f(~k_1), n_R>, ~sk_s)
- role: RuleStep3
  operations:
  - receive:
    - '''S'''
    - '''R'''
    - f_k1
    - sig
  - send: []
- role: RuleStep4
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - send:
    - <~m_1, f(~k_2)>
    - mac(k_1, <~m_1, f(~k_2)>)
- role: RuleStep5
  operations:
  - receive:
    - D_1
    - mac_1
  - send: []
- role: RuleStep6
  operations:
  - generate_nonces:
    - ~k_3
    - ~m_2
  - send:
    - <~m_2, f(~k_3), k_1>
    - mac(k_2, <~m_2, f(~k_3), k_1>)
- role: RuleStep7
  operations:
  - receive:
    - <m_2, f_k3, k_1>
    - mac_2
  - send: <END>
