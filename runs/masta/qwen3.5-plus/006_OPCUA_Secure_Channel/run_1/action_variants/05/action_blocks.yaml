- role: RuleStep1
  operations:
  - generate_nonces:
    - ~tid1
  - send:
    - '''GEReq'''
- role: RuleStep2
  operations:
  - receive:
    - '''GEReq'''
  - generate_nonces:
    - ~tid2
  - send:
    - '''GERes'''
    - pk(~ServerPrivKey)
    - '''Sign'''
    - '''SecurityPolicy'''
    - '''UserTokenPolicy'''
- role: RuleStep3
  operations:
  - receive:
    - '''GERes'''
    - ServerCert
    - '''Sign'''
    - SecurityPolicy
    - UserTokenPolicy
  - generate_nonces:
    - ~Nc
    - ~tid3
  - compute:
    - RequestBody = <'OSCReq', pk(~ClientPrivKey), ~Nc>
    - RequestBodyDigest = h(<'OSCReq', pk(~ClientPrivKey), ~Nc>)
    - RequestSignature = sign(h(<'OSCReq', pk(~ClientPrivKey), ~Nc>), ~ClientPrivKey)
  - send:
    - pk(~ClientPrivKey)
    - RequestBody
    - RequestSignature
    - RequestBodyDigest
- role: RuleStep4
  operations:
  - receive:
    - ClientCert
    - RequestBody
    - RequestSignature
    - RequestBodyDigest
  - generate_nonces:
    - ~Ns
    - ~tid4
  - compute:
    - RequestBody = <'OSCReq', ClientPubKey, ClientNonce>
    - RequestBodyDigest = h(<'OSCReq', ClientPubKey, ClientNonce>)
    - ResponseBody = <'OSCRes', ~Ns, 'SecurityToken', 'TokenLifetime'>
    - ResponseBodyDigest = h(<'OSCRes', ~Ns, 'SecurityToken', 'TokenLifetime'>)
    - ResponseSignature = sign(h(<'OSCRes', ~Ns, 'SecurityToken', 'TokenLifetime'>),
      ~ServerPrivKey)
    - ChannelBinding = h(<ClientNonce, ~Ns>)
  - send:
    - pk(~ServerPrivKey)
    - ResponseBody
    - ResponseSignature
    - ResponseBodyDigest
    - '''TokenType'''
- role: RuleStep5
  operations:
  - receive:
    - ServerCert
    - ResponseBody
    - ResponseSignature
    - ResponseBodyDigest
    - '''TokenType'''
  - compute:
    - ResponseBody = <'OSCRes', ServerNonce, SecurityToken, TokenLifetime>
    - ResponseBodyDigest = h(<'OSCRes', ServerNonce, SecurityToken, TokenLifetime>)
    - ChannelBinding = h(<~Nc, ServerNonce>)
  - send:
    - '''<END>'''
- role: RuleStep6
  operations:
  - send: <END>
