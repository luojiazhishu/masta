- role: RuleStep1
  operations:
  - generate_nonces:
    - ~eskI
    - ~tid
  - compute:
    - exI = h1(<~eskI, ~lkI>)
    - hkI = 'g'^h1(<~eskI, ~lkI>)
  - send:
    - hkI
- role: RuleStep2
  operations:
  - receive:
    - hkI
  - generate_nonces:
    - ~eskR
    - ~sessionCorr
    - ~tidR
  - compute:
    - exR = h1(<~eskR, ~lkR>)
    - hkR = 'g'^h1(<~eskR, ~lkR>)
  - send:
    - hkR
    - ~sessionCorr
- role: RuleStep3
  operations:
  - receive:
    - hkR
    - sessionCorr
  - send: <END>
