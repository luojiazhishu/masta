- role: RuleStep1
  operations:
  - generate_nonces:
    - ~eskI
    - ~tid
  - compute:
    - exI = h1(<~eskI, ~lkI>)
    - hkI = 'g'^h1(<~eskI, ~lkI>)
  - send:
    - hkI
- role: RuleStep2
  operations:
  - receive:
    - X
  - generate_nonces:
    - ~eskR
    - ~tid
  - compute:
    - exR = h1(<~eskR, ~lkR>)
    - hkR = 'g'^h1(<~eskR, ~lkR>)
    - kR = h2(<pkI^h1(<~eskR, ~lkR>), X^~lkR, $I, $R>)
  - send:
    - hkR
- role: RuleStep3
  operations:
  - receive:
    - Y
  - compute:
    - kI = h2(<Y^~lkI, pkR^exI, $I, $R>)
    - peerTag = tag(pkR)
  - send: <END>
