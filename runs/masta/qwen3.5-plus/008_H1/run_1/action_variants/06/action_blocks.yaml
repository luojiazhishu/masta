- role: RuleStep1
  operations:
  - generate_nonces:
    - ~tid
  - compute:
    - mI = sign(<$I, $R>, ~ltkI)
  - send:
    - mI
- role: RuleStep2
  operations:
  - receive:
    - mI
  - generate_nonces:
    - ~tidR
  - compute:
    - mR = sign(<$I, $R>, ~ltkR)
    - audit_marker = com($R, $I)
  - send:
    - mR
- role: RuleStep3
  operations:
  - receive:
    - mR
  - send: <END>
