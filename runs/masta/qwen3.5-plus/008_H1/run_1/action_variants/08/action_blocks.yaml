- role: RuleStep1
  operations:
  - generate_nonces:
    - ~tid
  - compute:
    - mI = sign(<$I, $R>, ~ltkI)
  - send:
    - mI
- role: RuleStep2
  operations:
  - receive:
    - mI
  - compute:
    - mR = sign(<$I, $R>, ~ltkR)
  - send:
    - mR
- role: RuleStep3
  operations:
  - compute:
    - mR = sign(<$I, $R>, ~ltkR)
  - send:
    - mR
- role: RuleStep4
  operations:
  - receive:
    - mR
  - send: <END>
