- role: RuleStep1
  operations:
  - generate_nonces:
    - ~DevNonce
  - compute:
    - RequestMAC = mac(~AppKey, <'JoinRequest', ~DevEUI, ~JoinEUI, ~DevNonce>)
  - send:
    - '''JoinRequest'''
    - ~DevEUI
    - ~JoinEUI
    - ~DevNonce
    - RequestMAC
- role: RuleStep2
  operations:
  - receive:
    - '''JoinRequest'''
    - ~DevEUI
    - ~JoinEUI
    - DevNonce
    - ExpectedMAC
  - generate_nonces:
    - ~JoinNonce
  - compute:
    - ExpectedMAC = mac(~AppKey, <'JoinRequest', ~DevEUI, ~JoinEUI, DevNonce>)
    - ResponseMAC = mac(~AppKey, <'JoinAccept', ~JoinNonce, ~DevAddr>)
    - AppSKey = senc(<cst1, DevNonce, ~JoinNonce>, ~AppKey)
    - NwkSKey = senc(<cst2, DevNonce, ~JoinNonce>, ~AppKey)
  - send:
    - senc(<'JoinAccept', ~JoinNonce, ~DevAddr, ResponseMAC>, ~AppKey)
- role: RuleStep3
  operations:
  - receive:
    - senc(<'JoinAccept', JoinNonce, DevAddr, ExpectedResponseMAC>, ~AppKey)
  - compute:
    - ExpectedResponseMAC = mac(~AppKey, <'JoinAccept', JoinNonce, DevAddr>)
    - AppSKey = senc(<cst1, DevNonce, JoinNonce>, ~AppKey)
    - NwkSKey = senc(<cst2, DevNonce, JoinNonce>, ~AppKey)
  - send: <END>
