- role: RuleStep1
  operations:
  - generate_nonces:
    - ~RB
    - ~Text1
  - send:
    - ~RB
    - ~Text1
    - '''init_b'''
- role: RuleStep2
  operations:
  - receive:
    - RB
    - Text1
    - '''init_b'''
  - generate_nonces:
    - ~RA
    - ~Text2
    - ~Text3
    - ~tidA
  - send:
    - ~RA
    - ~Text3
    - <'sid1_mut_cr', ~RA, RB, $B, ~Text2>
    - mac(<'sid1_mut_cr', ~RA, RB, $B>, ~kAB)
- role: RuleStep3
  operations:
  - receive:
    - RA
    - Text3
    - <'sid1_mut_cr', RA, RB, $B, Text2>
    - MAC1
  - generate_nonces:
    - ~Text4
    - ~Text5
    - ~tidB
  - send:
    - ~Text5
    - mac(<'sid2_mut_cr', RB, RA>, ~kAB)
- role: RuleStep4
  operations:
  - receive:
    - Text5
    - MAC2
  - send: <END>
