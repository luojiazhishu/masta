- role: RuleStep1
  operations:
  - generate_nonces:
    - ~RB
    - ~Text1
  - send:
    - ~RB
    - ~Text1
- role: RuleStep2
  operations:
  - receive:
    - RB
    - Text1
  - generate_nonces:
    - ~RA
    - ~Text2
    - ~Text3
  - compute:
    - mac1 = mac(<'sid1_mut_cr', ~RA, RB, 'IdB'>, kAB)
  - send:
    - '''token_ab'''
    - ~RA
    - ~Text3
    - <'sid1_mut_cr', ~RA, RB, 'IdB', ~Text2>
    - mac1
- role: RuleStep3
  operations:
  - receive:
    - '''token_ab'''
    - RA
    - Text3
    - <'sid1_mut_cr', RA, RB, 'IdB', Text2>
    - mac1_check
  - generate_nonces:
    - ~Text4
    - ~Text5
  - compute:
    - mac1_check = mac(<'sid1_mut_cr', RA, RB, 'IdB'>, kAB)
    - mac2 = mac(<'sid2_mut_cr', RB, RA>, kAB)
  - send:
    - ~Text5
    - mac2
- role: RuleStep4
  operations:
  - receive:
    - Text5
    - mac2_check
  - compute:
    - mac2_check = mac(<'sid2_mut_cr', RB, RA>, kAB)
  - send: <END>
