- role: RuleStep1
  operations:
  - compute:
    - mI = sign(<$I, $R>, ltkI)
  - send:
    - mI
- role: RuleStep2
  operations:
  - receive:
    - mI
  - compute:
    - mR = sign(<$I, $R>, ltkR)
  - assert:
    - verify(mI, <$I, $R>, pkI) = true
  - send:
    - mR
- role: RuleStep3
  operations:
  - receive:
    - mR
  - assert:
    - verify(mR, <$I, $R>, pkR) = true
  - send: <END>
