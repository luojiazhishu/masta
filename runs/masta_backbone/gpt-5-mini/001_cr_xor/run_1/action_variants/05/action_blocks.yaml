- role: RuleStep1
  operations:
  - generate_nonces:
    - ~na
  - send:
    - ~na
- role: RuleStep2
  operations:
  - receive:
    - na
  - generate_nonces:
    - ~nb
  - send:
    - h(na ⊕ k ⊕ ~nb)
    - ~nb
- role: RuleStep3
  operations:
  - receive:
    - h(na ⊕ k ⊕ nb)
    - nb
  - send: <END>
