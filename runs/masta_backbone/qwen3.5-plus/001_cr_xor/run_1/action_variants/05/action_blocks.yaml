- role: RuleStep1
  operations:
  - generate_nonces:
    - ~na
  - send:
    - ~na
- role: RuleStep2
  operations:
  - receive:
    - ~na
  - generate_nonces:
    - ~nb
  - compute:
    - tag = h(~na XOR ~k XOR ~nb)
  - send:
    - tag
    - ~nb
- role: RuleStep3
  operations:
  - receive:
    - tag
    - nb
  - compute:
    - t_prime = h(~na XOR ~k XOR nb)
  - send: <END>
