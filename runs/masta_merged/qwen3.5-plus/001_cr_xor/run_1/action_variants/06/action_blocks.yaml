- role: RuleStep1
  operations:
  - generate_nonces:
    - ~na
  - send:
    - ~na
- role: RuleStep2
  operations:
  - receive:
    - ~na
  - generate_nonces:
    - ~nb
  - send:
    - h(<~na ⊕ ~k ⊕ ~nb, 'Init'>)
    - ~nb
- role: RuleStep3
  operations:
  - receive:
    - tag
    - ~nb
  - send: <END>
