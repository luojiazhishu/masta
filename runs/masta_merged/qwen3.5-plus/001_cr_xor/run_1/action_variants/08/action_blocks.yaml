- role: RuleStep1
  operations:
  - generate_nonces:
    - ~na
  - send:
    - ~na
- role: RuleStep2
  operations:
  - send:
    - ~na
- role: RuleStep3
  operations:
  - receive:
    - ~na
  - generate_nonces:
    - ~nb
  - send:
    - h(~na XOR k XOR ~nb)
    - ~nb
- role: RuleStep4
  operations:
  - receive:
    - h(~na XOR k XOR nb)
    - nb
  - send: <END>
