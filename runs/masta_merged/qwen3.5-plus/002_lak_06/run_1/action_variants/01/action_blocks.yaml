- role: RuleStep1
  operations:
  - generate_nonces:
    - ~r0
    - ~r0_aux
  - send:
    - ~r0
    - ~r0_aux
- role: RuleStep2
  operations:
  - receive:
    - r0
    - r0_aux
  - generate_nonces:
    - ~r1
  - send:
    - ~r1
    - h(r0 ⊕ ~r1 ⊕ k)
- role: RuleStep3
  operations:
  - receive:
    - r1
    - tag_mac
  - compute:
    - expected = h(r0 ⊕ r1 ⊕ k)
    - reader_mac = h(tag_mac ⊕ k ⊕ r0)
  - send:
    - reader_mac
- role: RuleStep4
  operations:
  - receive:
    - reader_mac
  - compute:
    - expected = h(tag_mac ⊕ k ⊕ r0)
  - send: <END>
