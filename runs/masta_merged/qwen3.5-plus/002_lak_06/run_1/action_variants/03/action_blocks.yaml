- role: RuleStep1
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: RuleStep2
  operations:
  - receive:
    - ~r0
  - generate_nonces:
    - ~r1
  - send:
    - ~r1
    - h(~r0 ⊕ ~r1 ⊕ ~k)
- role: RuleStep3
  operations:
  - receive:
    - r1
    - tag_mac
  - generate_nonces:
    - ~conf_aux
  - compute:
    - expected_tag_mac = h(r0 ⊕ r1 ⊕ k)
    - reader_mac = h(tag_mac ⊕ k ⊕ r0)
  - send:
    - reader_mac
    - ~conf_aux
- role: RuleStep4
  operations:
  - receive:
    - reader_mac
    - conf_aux
  - compute:
    - expected_reader_mac = h(h(r0 ⊕ r1 ⊕ k) ⊕ k ⊕ r0)
  - send: <END>
