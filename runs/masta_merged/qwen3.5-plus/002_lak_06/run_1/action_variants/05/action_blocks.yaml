- role: RuleStep1
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: RuleStep2
  operations:
  - receive:
    - ~r0
  - generate_nonces:
    - ~r1
  - send:
    - '''TAG_HDR'''
    - ~r1
    - h(~r0 XOR ~r1 XOR k)
- role: RuleStep3
  operations:
  - receive:
    - '''TAG_HDR'''
    - r1
    - tag_mac
  - send:
    - h(tag_mac XOR k XOR r0)
- role: RuleStep4
  operations:
  - receive:
    - reader_mac
  - send: <END>
