- role: RuleStep1
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: RuleStep2
  operations:
  - receive:
    - ~r0
  - generate_nonces:
    - ~r1
  - send:
    - ~r1
    - h(~r0 ⊕ ~r1 ⊕ k)
- role: RuleStep3
  operations:
  - receive:
    - ~r1
    - tag_mac
  - send:
    - h(tag_mac ⊕ k ⊕ ~r0 ⊕ 'CONFIRM')
- role: RuleStep4
  operations:
  - receive:
    - reader_mac
  - send: <END>
