- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
    - ~rc
  - compute:
    - m1_ciphertext = aenc(~k, pk(~sk_s))
    - m1 = <aenc(~k, pk(~sk_s)), ~rc>
  - send:
    - m1
- role: RuleStep2
  operations:
  - receive:
    - ciphertext
    - rc
  - compute:
    - k = adec(ciphertext, ~sk_s)
    - digest = h(adec(ciphertext, ~sk_s))
    - m2 = <h(adec(ciphertext, ~sk_s)), rc>
  - send:
    - m2
- role: RuleStep3
  operations:
  - receive:
    - digest
    - rc
  - generate_nonces:
    - ~k
    - ~rc
  - compute:
    - expected_digest = h(k)
  - send: <END>
