- role: RuleStep1
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
    - ~r0
- role: RuleStep2
  operations:
  - receive:
    - r0
    - r0
  - generate_nonces:
    - ~r1
  - send:
    - ~r1
    - h(r0 XOR ~r1 XOR k)
- role: RuleStep3
  operations:
  - receive:
    - r1
    - h(r0 XOR r1 XOR k)
  - send:
    - h(h(r0 XOR r1 XOR k) XOR k XOR r0)
- role: RuleStep4
  operations:
  - receive:
    - h(h(r0 XOR r1 XOR k) XOR k XOR r0)
  - send: <END>
