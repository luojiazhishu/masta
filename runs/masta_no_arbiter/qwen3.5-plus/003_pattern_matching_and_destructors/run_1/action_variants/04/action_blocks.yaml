- role: RuleStep1
  operations:
  - generate_nonces:
    - ~sec
    - ~pub
    - ~k
  - compute:
    - msg = senc(<~sec, ~pub>, ~k)
  - send:
    - msg
- role: RuleStep2
  operations:
  - receive:
    - ciphertext
  - generate_nonces:
    - k
  - compute:
    - decrypted = sdec(ciphertext, k)
    - sec = fst(sdec(ciphertext, k))
    - pub = snd(sdec(ciphertext, k))
    - auxr = tag_aux(fst(sdec(ciphertext, k)), snd(sdec(ciphertext, k)))
  - send: <END>
