- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
    - ~rc
  - compute:
    - m1_ciphertext = aenc(~k, pk(~sk_S))
    - m1 = <aenc(~k, pk(~sk_S)), ~rc>
  - send:
    - m1
- role: RuleStep2
  operations:
  - receive:
    - m1
  - compute:
    - m1_ciphertext = fst(m1)
    - rc_received = snd(m1)
    - k_prime = adec(fst(m1), ~sk_S)
    - digest = h(adec(fst(m1), ~sk_S))
    - m2 = <h(adec(fst(m1), ~sk_S)), snd(m1)>
  - send:
    - m2
- role: RuleStep3
  operations:
  - receive:
    - m2
  - compute:
    - m2_digest = fst(m2)
    - m2_rc = snd(m2)
    - expected_digest = h(~k)
  - send: <END>
