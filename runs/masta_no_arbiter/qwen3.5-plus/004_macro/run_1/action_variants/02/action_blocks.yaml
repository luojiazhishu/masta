- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
  - compute:
    - m1 = aenc(~k, pkS)
  - send:
    - m1
- role: RuleStep2
  operations:
  - receive:
    - m1
  - generate_nonces:
    - ~rs
  - compute:
    - k = adec(m1, ~skS)
    - digest = h(adec(m1, ~skS))
    - m2 = <h(adec(m1, ~skS)), ~rs>
  - send:
    - m2
- role: RuleStep3
  operations:
  - receive:
    - m2
  - generate_nonces:
    - ~k
  - compute:
    - received_digest = fst(m2)
    - received_rs = snd(m2)
    - expected_digest = h(~k)
  - send: <END>
