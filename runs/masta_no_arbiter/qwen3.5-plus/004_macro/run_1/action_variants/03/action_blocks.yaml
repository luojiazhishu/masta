- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
  - send:
    - aenc(~k, pkS)
    - '''init'''
- role: RuleStep2
  operations:
  - receive:
    - ciphertext
    - '''init'''
  - send:
    - h(adec(ciphertext, skS))
- role: RuleStep3
  operations:
  - receive:
    - digest
  - generate_nonces:
    - ~k
  - send: <END>
