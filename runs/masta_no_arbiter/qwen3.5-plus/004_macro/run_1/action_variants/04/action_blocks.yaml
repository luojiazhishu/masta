- role: RuleStep1
  operations:
  - generate_nonces:
    - ~k
  - compute:
    - m1 = aenc(~k, pk(~skS))
  - send:
    - m1
- role: RuleStep2
  operations:
  - receive:
    - m1
  - compute:
    - k = adec(m1, ~skS)
    - digest = h(adec(m1, ~skS))
    - m2 = <h(adec(m1, ~skS)), 'ack'>
  - send:
    - m2
- role: RuleStep3
  operations:
  - receive:
    - m2
  - compute:
    - expected_digest = h(~k)
  - send: <END>
