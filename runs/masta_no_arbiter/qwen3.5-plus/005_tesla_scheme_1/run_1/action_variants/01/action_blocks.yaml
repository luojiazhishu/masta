- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
    - ~tag_R
  - send:
    - '''R'''
    - '''S'''
    - ~n_R
    - ~tag_R
- role: RuleStep2
  operations:
  - receive:
    - '''R'''
    - '''S'''
    - n_R
    - tag_R
  - generate_nonces:
    - ~k_1
  - send:
    - '''S'''
    - '''R'''
    - f(~k_1)
    - sign(<f(~k_1), n_R, tag_R>, ~sk_S)
- role: RuleStep3
  operations:
  - receive:
    - '''S'''
    - '''R'''
    - f_k1
    - sig
  - send: []
- role: RuleStep4
  operations:
  - generate_nonces:
    - ~k_2
  - send:
    - <'m_1', f(~k_2)>
    - MAC(~k_1, <'m_1', f(~k_2), 'null'>)
- role: RuleStep5
  operations:
  - receive:
    - D_1
    - mac_1
  - send: <END>
