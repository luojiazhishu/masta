- role: RuleStep1
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - $R
    - $S
    - ~n_R
- role: RuleStep2
  operations:
  - receive:
    - $R
    - $S
    - n_R
  - generate_nonces:
    - ~k_1
  - send:
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), n_R>, $SK_S)
- role: RuleStep3
  operations:
  - receive:
    - $S
    - $R
    - commitment
    - sig
  - generate_nonces:
    - ~n_R
  - send: []
- role: RuleStep4
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - send:
    - <~m_1, f(~k_2)>
    - MAC(~k_1, <~m_1, f(~k_2)>)
- role: RuleStep5
  operations:
  - receive:
    - D_1
    - mac_1
  - generate_nonces:
    - ~n_R
  - send: []
- role: RuleStep6
  operations:
  - generate_nonces:
    - ~k_3
    - ~m_2
  - send:
    - <~m_2, f(~k_3), ~k_1>
    - MAC(~k_2, <~m_2, f(~k_3), ~k_1>)
- role: RuleStep7
  operations:
  - receive:
    - D_2
    - mac_2
  - send: <END>
