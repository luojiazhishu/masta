- role: Setup
  operations:
  - generate_nonces:
    - ~k
  - send: []
- role: Reader_Start
  operations:
  - generate_nonces:
    - ~r0
  - send:
    - ~r0
- role: Tag_Respond
  operations:
  - receive:
    - r0
  - generate_nonces:
    - ~r1
  - send:
    - ~r1
    - h(r0 XOR ~r1 XOR ~k)
- role: Reader_Verify
  operations:
  - receive:
    - r1
    - tag_mac
  - assert:
    - tag_mac = h(~r0 XOR r1 XOR ~k)
  - send:
    - h(tag_mac XOR ~k XOR ~r0 XOR 'CONFIRM')
- role: Tag_Verify
  operations:
  - receive:
    - reader_mac
  - assert:
    - reader_mac = h(h(r0 XOR ~r1 XOR ~k) XOR ~k XOR r0 XOR 'CONFIRM')
  - send: <END>
