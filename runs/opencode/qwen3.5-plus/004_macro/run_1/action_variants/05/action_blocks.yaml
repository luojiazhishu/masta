- role: Client_Send
  operations:
  - generate_nonces:
    - ~k
  - send:
    - $C
    - aenc(~k, pkS)
- role: Server_Respond
  operations:
  - receive:
    - cid
    - c
  - send:
    - h(adec(c, skS))
    - '''done'''
- role: Client_Verify
  operations:
  - receive:
    - h(~k)
    - '''done'''
  - send: <END>
