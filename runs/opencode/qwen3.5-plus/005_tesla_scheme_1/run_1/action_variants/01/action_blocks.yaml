- role: Receiver_Init
  operations:
  - generate_nonces:
    - ~n_R
    - ~tag_R
  - send:
    - '''R'''
    - '''S'''
    - ~n_R
    - ~tag_R
- role: Sender_Respond
  operations:
  - receive:
    - '''R'''
    - '''S'''
    - n_R
    - tag_R
  - generate_nonces:
    - ~k_1
  - send:
    - '''S'''
    - '''R'''
    - h(~k_1)
    - sign(<h(~k_1), n_R, tag_R>, sk)
- role: Receiver_Verify
  operations:
  - receive:
    - '''S'''
    - '''R'''
    - f_k1
    - sig
  - send: []
- role: Sender_Stream_1
  operations:
  - generate_nonces:
    - ~m_1
    - ~k_2
  - send:
    - ~m_1
    - h(~k_2)
    - h(<~k_1, ~m_1, h(~k_2)>)
- role: Receiver_Cache_1
  operations:
  - receive:
    - m_1
    - f_k2
    - mac_1
  - send: []
- role: Sender_Stream_2
  operations:
  - generate_nonces:
    - ~m_2
    - ~k_3
  - send:
    - ~m_2
    - h(~k_3)
    - ~k_1
    - h(<~k_2, ~m_2, h(~k_3), ~k_1>)
- role: Receiver_Verify_Stream
  operations:
  - receive:
    - m_2
    - f_k3
    - k_1_disclose
    - mac_2
  - send: <END>
