- role: Test1_Init
  operations:
  - generate_nonces:
    - ~n_R
    - ~sk_S
    - ~pk_S
  - send:
    - '''R'''
    - '''S'''
    - ~n_R
- role: Test2_Respond
  operations:
  - receive:
    - '''R'''
    - '''S'''
    - n_R
  - generate_nonces:
    - ~k_1
    - ~sk_S
  - send:
    - '''S'''
    - '''R'''
    - f(~k_1)
    - sign(<f(~k_1), n_R>, ~sk_S)
- role: Test3_Verify
  operations:
  - receive:
    - '''S'''
    - '''R'''
    - f_k1
    - sig
  - send: []
- role: Test4_Stream1
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
    - ~r_1
  - send:
    - ~m_1
    - f(~k_2)
    - MAC(k_1, <~m_1, f(~k_2)>)
    - ~r_1
- role: Test5_Stream1Recv
  operations:
  - receive:
    - m_1
    - f_k2
    - mac_1
    - r_1
  - send: []
- role: Test6_StreamN
  operations:
  - generate_nonces:
    - ~m_n
    - ~k_n
    - ~k_next
  - send:
    - ~m_n
    - f(~k_next)
    - MAC(~k_n, <~m_n, f(~k_next), ~k_n>)
    - k_2
- role: Test7_StreamNRecv
  operations:
  - receive:
    - m_n
    - f_k_next
    - mac_n
    - k_disclosed
  - assert:
    - f(k_disclosed) = f_k2
    - MAC(k_disclosed, <m_n, f_k_next, k_disclosed>) = mac_n
  - send: <END>
