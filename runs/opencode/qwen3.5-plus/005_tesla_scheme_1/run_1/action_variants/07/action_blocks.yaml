- role: Receiver_Init
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - '''init'''
    - '''R'''
    - '''S'''
    - ~n_R
- role: Sender_Respond
  operations:
  - receive:
    - '''init'''
    - R
    - '''S'''
    - n_R
  - generate_nonces:
    - ~k_1
  - send:
    - '''S'''
    - R
    - f(~k_1)
    - sign(<f(~k_1), n_R>, skS)
- role: Receiver_VerifySetup
  operations:
  - receive:
    - '''S'''
    - R
    - fk1
    - sig
  - send: []
- role: Sender_Stream1
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - send:
    - <~m_1, f(~k_2)>
    - MAC(k1, <~m_1, f(~k_2)>)
    - '''data1_marker'''
- role: Receiver_Stream1
  operations:
  - receive:
    - <m1, fk2>
    - mac1
    - marker
  - send: <END>
