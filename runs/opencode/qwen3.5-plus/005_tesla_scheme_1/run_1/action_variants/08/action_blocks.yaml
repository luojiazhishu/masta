- role: R_Setup_Init
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - '''R'''
    - '''S'''
    - ~n_R
- role: S_Setup_Respond
  operations:
  - receive:
    - '''R'''
    - '''S'''
    - n_R
  - generate_nonces:
    - ~k_1
  - send:
    - '''S'''
    - '''R'''
    - f(~k_1)
    - sign(<'setup', f(~k_1), n_R, 'S'>, sk)
- role: R_Setup_Complete
  operations:
  - receive:
    - '''S'''
    - '''R'''
    - f_k1
    - sig
  - send: []
- role: S_Broadcast_Msg1
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - send:
    - ~m_1
    - f(~k_2)
    - h(<~k_1, ~m_1, f(~k_2)>)
- role: R_Receive_Msg1
  operations:
  - receive:
    - m_1
    - f_k2
    - mac_1
  - send: []
- role: S_Broadcast_MsgN
  operations:
  - generate_nonces:
    - ~k_next
    - ~m_n
  - send:
    - ~m_n
    - f(~k_next)
    - k_prev
    - h(<k_curr, ~m_n, f(~k_next), k_prev>)
    - '''channel_tag'''
- role: R_Receive_MsgN
  operations:
  - receive:
    - m_n
    - f_k_next
    - k_prev
    - mac_n
    - channel_tag
  - send: <END>
