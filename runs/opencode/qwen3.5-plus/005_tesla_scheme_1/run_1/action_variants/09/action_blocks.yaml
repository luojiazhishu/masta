- role: Receiver_Start
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - $R
    - $S
    - ~n_R
- role: Sender_Respond
  operations:
  - receive:
    - $R
    - $S
    - n_R
  - generate_nonces:
    - ~k_1
    - ~sk_S
  - send:
    - $S
    - $R
    - f(~k_1)
    - sign(<f(~k_1), n_R>, ~sk_S)
- role: Sender_Stream1
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - send:
    - ~m_1
    - f(~k_2)
    - mac(~k_1, <~m_1, f(~k_2)>)
- role: Receiver_VerifySetup
  operations:
  - receive:
    - $S
    - $R
    - fk1
    - sig
  - send: []
- role: Receiver_VerifyStream
  operations:
  - receive:
    - m_1
    - fk2
    - mac_val
  - send: <END>
