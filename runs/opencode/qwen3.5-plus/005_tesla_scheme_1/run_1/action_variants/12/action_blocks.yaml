- role: Receiver_Request
  operations:
  - generate_nonces:
    - ~n_R
  - send:
    - '''request'''
    - ~n_R
- role: Sender_Respond
  operations:
  - receive:
    - '''request'''
    - n_R
  - generate_nonces:
    - ~k_1
  - send:
    - f(~k_1)
    - sign(<f(~k_1), n_R>, SK_S)
- role: Sender_Stream1
  operations:
  - generate_nonces:
    - ~k_2
    - ~m_1
  - send:
    - ~m_1
    - f(~k_2)
    - MAC(k_1, <<~m_1, f(~k_2)>, 'stream'>)
- role: Sender_StreamN
  operations:
  - generate_nonces:
    - ~m_n
    - ~next_fk
  - send:
    - ~m_n
    - ~next_fk
    - k_prev
    - MAC(k_n, <<~m_n, ~next_fk, k_prev>, 'stream'>)
- role: Receiver_VerifySetup
  operations:
  - receive:
    - fk1
    - sig
  - send: []
- role: Receiver_AcceptStream1
  operations:
  - receive:
    - payload
    - next_fk
    - mac
  - send: []
- role: Receiver_AcceptStreamN
  operations:
  - receive:
    - payload
    - next_fk
    - disclosed_k
    - mac
  - send: <END>
