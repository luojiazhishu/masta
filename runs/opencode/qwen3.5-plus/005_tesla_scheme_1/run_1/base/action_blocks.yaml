- role: Receiver_SetupRequest
  operations:
  - generate_nonces:
    - ~nR
  - send:
    - '''req'''
    - ~nR
- role: Sender_SetupResponse
  operations:
  - receive:
    - '''req'''
    - nR
  - generate_nonces:
    - ~k1
  - send:
    - '''resp'''
    - h(~k1)
- role: Sender_Broadcast_Msg1
  operations:
  - generate_nonces:
    - ~k2
    - ~m1
  - send:
    - '''msg1'''
    - ~m1
    - h(~k2)
- role: Sender_Broadcast_Msg2
  operations:
  - generate_nonces:
    - ~k3
    - ~m2
  - send:
    - '''msg2'''
    - ~m2
    - h(~k3)
    - k1
- role: Receiver_Verify_Msg1
  operations:
  - receive:
    - '''msg2'''
    - m2
    - hk3
    - k1
  - send: <END>
