- role: Responder_Start
  operations:
  - generate_nonces:
    - ~RB
    - ~Text1
  - send:
    - ~RB
    - ~Text1
- role: Initiator_Respond
  operations:
  - receive:
    - RB
    - Text1
  - generate_nonces:
    - ~RA
    - ~Text2
    - ~Text3
  - send:
    - ~RA
    - ~Text3
    - <'sid1_mut_cr', ~RA, RB, 'B', ~Text2>
    - h(<~RA, RB, 'B', 'mac1_tag', kAB>)
- role: Responder_Verify
  operations:
  - receive:
    - RA
    - Text3
    - <'sid1_mut_cr', RA, RB, 'B', Text2>
    - h(<RA, RB, 'B', 'mac1_tag', kAB>)
  - generate_nonces:
    - ~Text5
  - send:
    - ~Text5
    - h(<RB, RA, kAB>)
- role: Initiator_Verify
  operations:
  - receive:
    - Text5
    - h(<RB, RA, kAB>)
  - send: <END>
